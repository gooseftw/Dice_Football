<!DOCTYPE html>
<!-- UPDATED 1.0 — start screen is You vs CPU, Pass and play, Team settings -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root { --navy:#0b1220; --card:#121a2b; --fg:#f4f7fb; --muted:#9aa7bd; --gold:#facc15; --turf:#146b2a; --side:#2f9a4a; --ink:#0b1220; --action:#22c55e; --action-fg:#052e16; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--navy); color:var(--fg); font-family:Barlow, system-ui, sans-serif; }
  button, input { font:inherit; color:inherit; }

  button:disabled { cursor:default; opacity:.45; }
  .wrap { max-width:28rem; margin:0 auto; padding:12px 12px 28px; }
  .eyebrow { margin:0; font-size:12px; font-weight:800; letter-spacing:.2em; color:var(--gold); }
  h1.title { margin:8px 0 0; font-size:2.25rem; font-weight:900; letter-spacing:-.02em; }
  .ver { margin:4px 0 0; font-size:12px; font-weight:800; letter-spacing:.18em; color:var(--gold); }

  .foot { margin-top:24px; color:var(--muted); font-size:14px; }
  .copy { margin:16px 0 0; text-align:center; color:var(--muted); font-size:11px; }
  .top { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; gap:8px; }

  .top .btns { display:flex; gap:6px; }

  .bug-names { display:grid; grid-template-columns:1fr 1fr; overflow:hidden; font-size:.68rem; font-weight:800; }

  .bug-row { display:grid; grid-template-columns:1fr auto 1fr; overflow:hidden; border-radius:0 0 12px 12px; }
  .slab { min-height:3.4rem; padding:4px 12px; display:flex; flex-direction:column; justify-content:center; }
  .slab.right { align-items:flex-end; }
  .slab .pts { font-size:1.7rem; font-weight:800; line-height:1; display:flex; align-items:center; gap:8px; }
  .dots { display:flex; gap:3px; margin-top:4px; }
  .dots i { width:6px; height:6px; border-radius:50%; display:block; }
  .role { margin-top:2px; font-size:.58rem; font-weight:900; letter-spacing:.14em; }
  .bug-mid { min-width:4.8rem; max-width:5.6rem; background:var(--navy); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:4px 6px; }
  .bug-mid.ot { background:var(--gold); color:var(--ink); }
  .bug-mid strong { font-size:.72rem; line-height:1.15; }
  .bug-mid span { margin-top:2px; font-size:.52rem; font-weight:800; color:var(--muted); line-height:1.15; }
  .bug-mid.ot span { color:#0b1220bf; }
  .field { margin-top:8px; border-radius:12px; overflow:hidden; background:var(--side); position:relative; }
  .yrow { position:relative; height:20px; color:#fff; font-size:.62rem; font-weight:900; }
  .yrow span { position:absolute; top:50%; transform:translate(-50%,-50%); }
  .turf { display:flex; height:7.5rem; background:var(--turf); }
  .ez { width:28px; flex:0 0 28px; }
  .ez svg { width:100%; height:100%; display:block; }
  .grid { position:relative; flex:1; min-width:0; }
  .cols { position:absolute; inset:0; display:flex; }
  .cols div { flex:1; position:relative; }
  .hash { position:absolute; left:50%; width:1px; height:8px; background:#ffffff8c; transform:translateX(-50%); }
  .hash.bot { bottom:2px; top:auto; }
  .hash.top { top:2px; }
  .marker { position:absolute; top:0; bottom:0; width:2px; background:var(--gold); z-index:1; }
  .ball { position:absolute; top:50%; width:23px; height:15px; margin:-7.5px 0 0 -11.5px; z-index:2; }
  .down { text-align:center; margin:12px 0; }
  .down .big { margin:0; font-size:1.875rem; font-weight:900; color:var(--gold); line-height:1; }
  .down .sub { margin:6px 0 0; font-size:12px; font-weight:600; color:var(--muted); }
  .dice { display:flex; justify-content:center; gap:12px; margin-bottom:12px; }
  .diecol { display:flex; flex-direction:column; align-items:center; gap:4px; }
  .die { width:56px; height:56px; border-radius:8px; display:grid; grid-template-columns:repeat(3,1fr); place-items:center; padding:6px; box-shadow:0 2px 6px #0006; }
  .die i { width:6px; height:6px; border-radius:50%; }
  .die.shake { animation:sh .12s linear infinite; }
  @keyframes sh { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-8deg) translateY(-2px)} 75%{transform:rotate(8deg) translateY(1px)} }
  .lbl { font-size:.6rem; font-weight:700; letter-spacing:.12em; color:var(--muted); }
  .outlook { background:var(--card); border-radius:12px; padding:12px; }
  .outlook h3 { margin:0; font-size:14px; font-weight:800; }
  .outlook p { margin:4px 0 8px; font-size:.78rem; color:var(--muted); line-height:1.35; }
  .faces { display:grid; grid-template-columns:repeat(6,1fr); gap:4px; }
  .face { border-radius:6px; padding:6px 2px; text-align:center; color:#fff; }
  .face.on { outline:2px solid var(--gold); transform:translateY(-2px); }
  .face.dim { opacity:.4; }
  .face b { display:block; font-size:.65rem; }
  .face em { display:block; font-style:normal; font-size:.58rem; font-weight:800; }
  .face small { display:block; font-size:.58rem; opacity:.9; }
  .row { display:grid; gap:8px; margin-top:12px; }
  .go { border:0; border-radius:12px; background:var(--action); color:var(--action-fg); padding:14px; font-size:16px; font-weight:800; }
  .ghost { border:0; border-radius:12px; background:var(--card); padding:12px; font-size:14px; font-weight:700; }
  .log { margin-top:12px; max-height:7rem; overflow:auto; font-size:12px; color:var(--muted); }
  .log div { padding:4px 0; border-bottom:1px solid #ffffff10; }
  .veil { position:absolute; inset:0; z-index:5; display:flex; align-items:center; justify-content:center; padding:12px; background:#0008; border:0; width:100%; }
  .veil.soft { background:#0004; pointer-events:none; }
  .card { width:100%; border-radius:12px; padding:16px; text-align:center; font-weight:900; }
  .sheet { position:fixed; inset:0; z-index:40; background:#0009; display:flex; align-items:flex-end; justify-content:center; padding:16px; }
  .sheet .panel { width:min(28rem,100%); max-height:80dvh; overflow:auto; background:var(--navy); border-radius:16px; padding:16px; }
  .kit { background:var(--card); border-radius:12px; padding:12px; margin-top:12px; }
  .kit p { margin:0; font-size:.65rem; font-weight:800; letter-spacing:.14em; color:var(--muted); }
  .kit input, .locked { margin-top:6px; width:100%; border:0; border-radius:8px; background:var(--navy); padding:8px 12px; font-size:16px; font-weight:800; }
  .locked { color:var(--muted); }
  .sw { margin-top:8px; }
  .sw p { margin:0 0 6px; font-size:.6rem; }
  .swatches { display:flex; flex-wrap:wrap; gap:6px; }
  .swatches button { width:28px; height:28px; border-radius:50%; border:0; padding:0; }
  .swatches button.on { outline:2px solid var(--gold); outline-offset:2px; }
  .swatches button:disabled { opacity:.25; }
  .coin { width:96px; height:96px; border-radius:50%; border:0; font-weight:900; box-shadow:0 8px 24px #0008; }
  .box { margin-top:12px; background:var(--card); border-radius:16px; padding:12px; }
  .box table { width:100%; border-collapse:collapse; font-size:14px; }
  .box td, .box th { padding:4px 0; }
  .box th { font-size:.65rem; letter-spacing:.06em; color:var(--muted); text-align:right; }
  .box td.l { color:var(--muted); text-align:left; }
  .tag { display:inline-block; margin-right:6px; border-radius:4px; padding:1px 4px; font-size:.55rem; font-weight:900; }
  .rules p, .rules li { color:var(--muted); font-size:14px; line-height:1.45; }
  .rules h3 { margin:0 0 6px; font-size:14px; }
  .rules strong { color:var(--fg); }
  .to { background:#7f1d1d; } .sack { background:#3f3f46; } .stuff { background:#1e293b; }
  .td { background:#854d0e; color:#fde68a; } .big { background:#1e3a8a; } .gain { background:#14532d; }
  .navyf { background:#0b1220; }
</style>
</head>
<body>
<div class="wrap" id="home">
  <p class="eyebrow">40 YARDS · 8 POSSESSIONS</p>
  <h1 class="title">Dice Football</h1>
  <p class="ver">1.0</p>
  <p class="blurb">Roll dice to move or stop the ball. Eight drives each.</p>
  <div class="stack">
    <button class="playbtn" type="button">You vs CPU</button>
    <button class="playbtn" type="button">Pass and play</button>
  </div>
  <div class="links"><button type="button">Team settings</button><button type="button">Rules</button></div>
  <p class="copy">© 2026 Dice Football. All rights reserved.</p>
</div>
<div class="wrap" id="play" hidden></div>
<div id="sheet"></div>
<script>
const FIELD=40, TD=7, SAFE=2, REG=8, KEY="diceFootball.v1", REC="diceFootball.records";
const PALETTE=[
  ["white","#f8fafc","White"],["ink","#0b1220","Ink"],["blue","#1d4ed8","Blue"],["red","#dc2626","Red"],
  ["gold","#ca8a04","Gold"],["orange","#ea580c","Orange"],["purple","#7c3aed","Purple"],["teal","#0f766e","Teal"],
  ["navy","#1e3a8a","Navy"],["maroon","#9f1239","Maroon"],["forest","#166534","Forest"]
];
const DEF_AWAY={primary:"#1d4ed8",secondary:"#f8fafc"};
const DEF_HOME={primary:"#dc2626",secondary:"#f8fafc"};
const other=t=>t==="away"?"home":"away";
const dir=t=>t==="away"?1:-1;
const toGoal=(t,s)=>t==="away"?FIELD-s:s;
const ownTen=t=>t==="away"?10:FIELD-10;
const puntSpot=t=>t==="away"?3:FIELD-3;
function nextStripe(t,s){ if(t==="away"){ if(s<10)return 10; if(s<20)return 20; if(s<30)return 30; return FIELD; } if(s>30)return 30; if(s>20)return 20; if(s>10)return 10; return 0; }
function seriesFrom(t,s){ const mark=nextStripe(t,s); let distance=Math.abs(mark-s); if(distance<1) distance=Math.max(1,toGoal(t,s)); return {marker:mark,distance}; }
function d6(){ return 1+Math.floor(Math.random()*6); }
function hexToRgb(hex){ const h=hex.replace("#",""); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
function channel(c){ const s=c/255; return s<=0.03928?s/12.92:Math.pow((s+0.055)/1.055,2.4); }
function lum(hex){ const [r,g,b]=hexToRgb(hex); return 0.2126*channel(r)+0.7152*channel(g)+0.0722*channel(b); }
function contrast(a,b){ const l1=lum(a), l2=lum(b), hi=Math.max(l1,l2), lo=Math.min(l1,l2); return (hi+0.05)/(lo+0.05); }
function pairAllowed(p,s){ if(p===s) return false; return (lum(p)>=0.22)!==(lum(s)>=0.22); }
function legalText(primary){ return PALETTE.map(c=>c[1]).filter(hex=>pairAllowed(primary,hex)); }
function clampPair(pair){
  const known=PALETTE.some(c=>c[1]===pair.primary);
  const primary=known?pair.primary:DEF_AWAY.primary;
  const legal=legalText(primary);
  const secondary=legal.indexOf(pair.secondary)>=0?pair.secondary:(legal[0]||"#f8fafc");
  return {primary,secondary};
}
function hueDist(a,b){ const d=Math.abs(a-b)%360; return d>180?360-d:d; }
function hexHue(hex){
  const [r,g,b]=hexToRgb(hex).map(n=>n/255); const max=Math.max(r,g,b), min=Math.min(r,g,b), d=max-min;
  if(!d) return 0; let h=0;
  if(max===r) h=((g-b)/d)%6; else if(max===g) h=(b-r)/d+2; else h=(r-g)/d+4;
  h=Math.round(h*60); return h<0?h+360:h;
}
function hslToHex(h,s,l){
  const sat=s/100, lig=l/100, a=sat*Math.min(lig,1-lig);
  const f=n=>{ const k=(n+h/30)%12; const c=lig-a*Math.max(Math.min(k-3,9-k,1),-1); return Math.round(255*c).toString(16).padStart(2,"0"); };
  return "#"+f(0)+f(8)+f(4);
}
function secondaryFor(primary){
  const onP=contrast(primary,"#f8fafc"), onI=contrast(primary,"#0b1220");
  if(onP>=onI && onP>=4.5) return "#f8fafc";
  if(onI>=4.5) return "#0b1220";
  return onP>=onI?"#f8fafc":"#0b1220";
}
function rollPrimary(avoid){
  for(let i=0;i<60;i++){
    const h=Math.floor(Math.random()*360);
    if(avoid!=null && hueDist(h,avoid)<50) continue;
    const s=58+Math.random()*30, light=Math.random()<0.18, l=light?58+Math.random()*14:24+Math.random()*20;
    if(h>98 && h<155 && l>22 && l<52) continue;
    const hex=hslToHex(h,s,l);
    if(Math.max(contrast(hex,"#f8fafc"), contrast(hex,"#0b1220"))<4.5) continue;
    return {hex,h};
  }
  return {hex:"#7c3aed",h:258};
}
function rollCpuColors(avoidPrimary){
  const a=rollPrimary(avoidPrimary?hexHue(avoidPrimary):undefined);
  return {primary:a.hex, secondary:secondaryFor(a.hex)};
}
function clip(s){ return String(s==null?"":s).slice(0,16); }
function cleanName(raw, fallback){ const t=String(raw||"").replace(/\s+/g," ").trim().slice(0,16); return t||fallback; }
function kitShort(name){ return (name||"").trim().toUpperCase()||"TEAM"; }
function blankStore(){
  return { teams:{ away:{name:"You", ...DEF_AWAY}, home:{name:"P2", ...DEF_HOME} }, game:null };
}
function loadStore(){
  try{
    const raw=localStorage.getItem(KEY);
    if(!raw) return blankStore();
    const p=JSON.parse(raw);
    if(!p||typeof p!=="object") throw new Error("bad");
    const away=p.teams&&p.teams.away||{};
    const home=p.teams&&p.teams.home||{};
    return {
      teams:{
        away:{ name:clip(away.name!=null?away.name:"You"), ...clampPair({primary:away.primary||DEF_AWAY.primary, secondary:away.secondary||DEF_AWAY.secondary}) },
        home:{ name:clip(home.name!=null?home.name:"P2"), ...clampPair({primary:home.primary||DEF_HOME.primary, secondary:home.secondary||DEF_HOME.secondary}) }
      },
      game: p.game&&typeof p.game==="object"&&(p.game.mode==="cpu"||p.game.mode==="hotseat") ? p.game : null
    };
  }catch(e){
    try{ localStorage.removeItem(KEY); }catch(err){}
    return blankStore();
  }
}
function saveStore(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }
let store=loadStore();
let cpuPreview=rollCpuColors(store.teams.away.primary);
function emptyBox(){ return {plays:0,standard:0,stuffed:0,sack:0,big:0,turnover:0,td:0,safetyGiven:0,safetyScored:0,punt:0,downs:0,yards:0,longest:0,oFaces:[0,0,0,0,0,0],dFaces:[0,0,0,0,0,0]}; }
function resolve(o1,o2,d,bonus){
  const sum=o1+o2, bothLow=o1<=2&&o2<=2, bothHigh=o1>=5&&o2>=5, base={o1,o2,d};
  if(o1===1&&o2===1&&d===6) return Object.assign({},base,{type:"pick6",yards:0});
  if(bothLow&&d>=5) return Object.assign({},base,{type:"turnover",yards:0});
  if(d>sum) return Object.assign({},base,{type:"sack",yards:-2*(d-sum)});
  if(d>o1&&d>o2) return Object.assign({},base,{type:"stuffed",yards:0});
  const yards=sum-d;
  if(o1===6&&o2===6&&d===1) return Object.assign({},base,{type:"house",yards});
  if(bothHigh&&d<=2){
    if(bonus==null) return Object.assign({},base,{type:"big",yards});
    return Object.assign({},base,{type:"big",yards:yards+bonus,bonus});
  }
  return Object.assign({},base,{type:"standard",yards});
}
const LABELS={pick6:"P6",turnover:"TO",sack:"SACK",stuffed:"STUFF",house:"HOUSE",big:"BIG",standard:"GAIN"};
function outlookFor(o1,o2){
  const rows=[];
  for(let d=1;d<=6;d++){
    const res=resolve(o1,o2,d,0);
    let ytxt=res.type==="pick6"||res.type==="house"?"TD":res.type==="turnover"?"ball":res.type==="big"?"+"+(o1+o2-d)+"+?":res.yards>0?"+"+res.yards:String(res.yards);
    rows.push({d,type:res.type,label:LABELS[res.type],ytxt,yards:res.yards});
  }
  const parts=[], group=(pred,text)=>{ const ds=rows.filter(pred).map(r=>r.d); if(ds.length) parts.push(text.replace("%s", ds.join(" or "))); };
  group(r=>r.type==="pick6","Pick six on %s");
  group(r=>r.type==="turnover","Turnover on %s");
  group(r=>r.type==="sack","Sack on %s");
  group(r=>r.type==="stuffed","Stuffed on %s");
  group(r=>r.type==="house","To the house on %s");
  group(r=>r.type==="big","Big play on %s");
  const std=rows.filter(r=>r.type==="standard");
  if(std.length){ const ys=std.map(r=>r.yards), min=Math.min.apply(null,ys), max=Math.max.apply(null,ys); parts.push(min===max?"Standard +"+min+" otherwise":"Standard +"+min+" to +"+max+" otherwise"); }
  return {rows, summary:parts.join(". ")+"."};
}
function kitsFor(mode){
  const awayName=cleanName(store.teams.away.name, mode==="cpu"?"You":"P1");
  const homeName=mode==="cpu"?"CPU":cleanName(store.teams.home.name,"P2");
  const awayColors=clampPair(store.teams.away);
  const homeColors=mode==="cpu"?rollCpuColors(awayColors.primary):clampPair(store.teams.home);
  return { away:{name:awayName,...awayColors}, home:{name:homeName,...homeColors} };
}
function newGame(mode){
  return {
    away:0,home:0,offense:"away",spot:20,marker:20,down:1,distance:10,over:false,mode,phase:"reg",
    poss:{away:0,home:0},otPoss:{away:0,home:0},snap:"offense",
    pendingO1:null,pendingO2:null,pendingD:null,log:[],
    outlookHead:"Coin toss",outlookSum:"Flip the coin. Whoever shows receives.",outlookHit:null,
    awaitingToss:true,kits:kitsFor(mode),box:{away:emptyBox(),home:emptyBox()},recorded:false
  };
}
let state=null, screen="home", busy=false, banner=null, bannerWait=null, cpuTimer=0, boxOpen=false, showD4=false, d4=null;
let faces={d1:null,d2:null,d3:null};
let rolling={o:false,d:false,b:false};
function label(team, caps){ const n=state.kits[team].name; return caps?kitShort(n):n; }
function spotName(spot){
  const s=Math.round(spot);
  const left=/^you$/i.test(state.kits.away.name)?"your":state.kits.away.name+"'s";
  const right=/^cpu$/i.test(state.kits.home.name)?"the CPU":state.kits.home.name+"'s";
  if(s<0) return /^you$/i.test(state.kits.away.name)?"your end zone":state.kits.away.name+" end zone";
  if(s>FIELD) return state.kits.home.name+" end zone";
  if(s<=0) return left+" 0";
  if(s>=FIELD) return right+" 0";
  if(s===20) return "midfield";
  if(s<20) return left+" "+s;
  return right+" "+(FIELD-s);
}
function scoreOf(t){ return t==="away"?state.away:state.home; }
function remainingPoss(team){
  if(state.phase==="ot") return state.otPoss[team]<Math.max(state.otPoss.away,state.otPoss.home,1)?1:0;
  return Math.max(0, REG-state.poss[team]);
}
function cannotCatch(leader,trail){ return scoreOf(leader)-scoreOf(trail)>remainingPoss(trail)*TD; }
function gameClinched(){ return cannotCatch("away","home")||cannotCatch("home","away"); }
function cpuWantsPunt(){
  if(state.down!==4) return false;
  const cpu=state.offense, deficit=scoreOf(other(cpu))-scoreOf(cpu), left=remainingPoss(cpu);
  if(deficit>(left-1)*TD) return false;
  const own=cpu==="away"?state.spot:FIELD-state.spot;
  if(toGoal(cpu,state.spot)<=10) return false;
  if(own<10) return state.distance>1;
  if(own<=20) return state.distance>3;
  return state.distance>=8;
}
function downPhrase(){
  const w=["","1st","2nd","3rd","4th"][state.down]||state.down+"th";
  const dist=toGoal(state.offense,state.spot)<=state.distance?"Goal":String(state.distance);
  return w+" & "+dist;
}
function resetSnap(){ state.snap="offense"; }
function startDrive(team, keep, at){
  state.offense=team;
  if(at!=null) state.spot=at; else if(!keep) state.spot=ownTen(team);
  const series=seriesFrom(team, state.spot);
  state.marker=series.marker; state.distance=series.distance; state.down=1; resetSnap();
}
function beginToss(){

  return '<div class="box"><h2 style="margin:0 0 8px;font-size:18px">'+esc(title)+" "+state.away+"–"+state.home+'</h2><table><tr><th></th><th>'+esc(label("away"))+'</th><th>'+esc(label("home"))+'</th></tr>'+
    row("TDs",a.td,h.td,"TD","td")+row("Turnovers",a.turnover,h.turnover,"TO","to")+row("Punts",a.punt,h.punt)+row("Stuffed",a.stuffed,h.stuffed)+row("Sacks",a.sack,h.sack,"SACK","sack")+row("Big plays",a.big,h.big,"BIG","big")+row("Yards",a.yards,h.yards)+row("Longest",a.longest,h.longest)+
    '</table><p style="color:var(--muted);font-size:12px">Possessions '+state.poss.away+"–"+state.poss.home+(state.phase==="ot"?" · OT "+state.otPoss.away+"–"+state.otPoss.home:"")+'</p><p style="color:var(--muted);font-size:12px">'+esc(rec)+'</p><div class="row" style="grid-template-columns:1fr 1fr"><button class="go" id="rematch" type="button">Rematch</button><button class="ghost" id="boxClose" type="button">Close</button></div></div>';
}
function loadRec(){
  try{ const p=JSON.parse(localStorage.getItem(REC)||"null"); if(!p) throw 0; return p; }catch(e){ return {cpu:{w:0,l:0,t:0,last10:[]},hotseat:{w:0,l:0,t:0,last10:[]}}; }
}
function recordFinished(){
  if(state.recorded) return;
  state.recorded=true;
  const rec=loadRec();
  const bucket=state.mode==="cpu"?rec.cpu:rec.hotseat;
  const result=state.away>state.home?"W":state.away<state.home?"L":"T";
  if(result==="W") bucket.w++; else if(result==="L") bucket.l++; else bucket.t++;
  bucket.last10=(bucket.last10||[]).concat(result).slice(-10);
  try{ localStorage.setItem(REC, JSON.stringify(rec)); }catch(e){}
}
function careerLine(mode){
  const rec=loadRec(); const b=mode==="cpu"?rec.cpu:rec.hotseat; const last=(b.last10||[]).join("")||"—";
  return mode==="cpu"?"vs CPU "+b.w+"–"+b.l+"–"+b.t+" · last 10: "+last:"Pass and play "+b.w+"–"+b.l+"–"+b.t+" · last 10: "+last;
}
function renderPlay(){
  const cpuOff=state.mode==="cpu"&&state.offense==="home"&&!state.over&&state.snap==="offense";
  const cpuBon=state.mode==="cpu"&&state.offense==="home"&&!state.over&&state.snap==="bonus";
  const userDef=!(state.mode==="cpu"&&state.offense==="away")&&state.snap==="defense";
  const rollOff=state.over||state.awaitingToss||busy||(banner&&banner.kind!=="play")||cpuOff||cpuBon||(state.snap==="defense"&&!userDef&&state.mode==="cpu");
  const puntOff=state.over||state.awaitingToss||busy||(banner&&banner.kind!=="play")||state.down!==4||cpuOff||state.snap!=="offense";
  const rollLabel=state.snap==="bonus"?"Roll Bonus":state.snap==="defense"?"Roll Defense":"Roll Offense";
  document.getElementById("play").innerHTML=
    '<header class="top"><h1>DICE FOOTBALL 1.0</h1><div class="btns"><button class="chip" id="menu" type="button">Menu</button><button class="chip" id="newg" type="button">New game</button><button class="chip" id="rules" type="button">Rules</button></div></header>'+
    '<div id="bug">'+scoreHTML()+'</div><div style="position:relative" id="stage">'+fieldHTML(state)+bannerHTML()+coinHTML()+'</div>'+
    downHTML()+diceHTML()+outlookHTML()+
    '<div class="row"><button class="go" id="roll" type="button"'+(rollOff?" disabled":"")+'>'+rollLabel+'</button><button class="ghost" id="punt" type="button"'+(puntOff?" disabled":"")+'>Punt (4th)</button></div>'+
    '<div class="log">'+state.log.map(l=>"<div>"+esc(l)+"</div>").join("")+"</div>"+boxHTML();
  const roll=document.getElementById("roll");
  roll.onclick=()=>{ if(state.snap==="offense") void doOffense(); else if(state.snap==="bonus") void doBonus(); else void doDefense(); };
  document.getElementById("punt").onclick=()=>void doPunt();
  document.getElementById("menu").onclick=()=>{ persistGame(); screen="home"; show(); };
  document.getElementById("newg").onclick=()=>beginFresh(state.mode);
  document.getElementById("rules").onclick=()=>openRules();
  const veil=document.getElementById("veil");
  if(veil) veil.onclick=()=>{ if(banner&&banner.persist){ const done=banner.kind==="over"; hideBanner(); if(done){ boxOpen=true; renderPlay(); } } };
  const flip=document.getElementById("flip");
  if(flip) flip.onclick=()=>void doFlip(flip);
  const rem=document.getElementById("rematch");
  if(rem) rem.onclick=()=>beginFresh(state.mode);
  const bc=document.getElementById("boxClose");
  if(bc) bc.onclick=()=>{ boxOpen=false; renderPlay(); };
}
let flipLock=false;
async function doFlip(btn){
  if(flipLock||!state.awaitingToss) return;
  flipLock=true;
  const land=Math.random()<0.5?"away":"home";
  let side="away", elapsed=0, interval=50;
  while(elapsed<900){
    side=side==="away"?"home":"away";
    const kit=state.kits[side];
    btn.style.background=kit.primary; btn.style.color=kit.secondary; btn.textContent=kitShort(kit.name);
    await sleep(interval); elapsed+=interval; interval=Math.min(160, interval*1.18);
  }
  const kit=state.kits[land];
  btn.style.background=kit.primary; btn.style.color=kit.secondary; btn.textContent=kitShort(kit.name);
  applyToss(land); flipLock=false; persistGame(); renderPlay(); scheduleCpu();
}
function renderHome(){
  const awayName=store.teams.away.name||"You";
  const homeName=store.teams.home.name||"P2";
  const preview={
    spot:10, marker:20,
    kits:{ away:{name:cleanName(store.teams.away.name,"You"), ...clampPair(store.teams.away)}, home:{name:"CPU", ...cpuPreview} }
  };
  const g=store.game;
  const can=g && g.over===false && (g.awaitingToss||g.away||g.home||(g.poss&&(g.poss.away||g.poss.home))||(g.log&&g.log.length)||g.phase==="ot"||g.down!==1||g.snap!=="offense");
  document.getElementById("home").innerHTML=
    '<p class="eyebrow">40 YARDS · 8 POSSESSIONS</p><h1 class="title">Dice Football</h1><p class="ver">1.0</p><p class="blurb">Roll dice to move or stop the ball. Eight drives each.</p>'+
    '<div style="margin-top:32px">'+fieldHTML(preview)+'</div><div class="stack">'+
    (can?'<button class="playbtn" id="cont" type="button">Continue '+g.away+'–'+g.home+'<small>'+(g.mode==="cpu"?"You vs CPU":"Pass and play")+'</small></button>':"")+
    '<button class="playbtn" id="cpu" type="button">You vs CPU</button><button class="playbtn" id="hot" type="button">Pass and play</button></div>'+
    '<div class="links"><button type="button" id="teams">Team settings</button><button type="button" id="rulesHome">Rules</button></div>'+
    '<p class="foot">'+esc(awayName)+' is left. CPU is right vs computer. '+esc(homeName)+' is right in pass and play.</p>'+
    '<p class="copy">© 2026 Dice Football. All rights reserved.</p>';
  const c=document.getElementById("cont");
  if(c) c.onclick=()=>resume();
  document.getElementById("cpu").onclick=()=>beginFresh("cpu");
  document.getElementById("hot").onclick=()=>beginFresh("hotseat");
  document.getElementById("teams").onclick=()=>openTeams();
  document.getElementById("rulesHome").onclick=()=>openRules();
}
function show(){
  document.getElementById("home").hidden=screen!=="home";
  document.getElementById("play").hidden=screen!=="play";
  if(screen==="home") renderHome(); else renderPlay();
}
function beginFresh(mode){
  clearTimeout(cpuTimer); busy=false; banner=null; bannerWait=null; boxOpen=false; showD4=false; d4=null; faces={d1:null,d2:null,d3:null}; flipLock=false;
  state=newGame(mode); clearGame(); screen="play"; persistGame(); show();
}
function resume(){
  const g=store.game; if(!g||g.over) return;
  clearTimeout(cpuTimer); busy=false; banner=null; boxOpen=!!g.over; showD4=g.snap==="bonus"; d4=null; flipLock=false;
  state=newGame(g.mode);
  ["away","home","offense","spot","marker","down","distance","phase","mode","snap","over","awaitingToss","outlookHead","outlookSum","outlookHit","recorded"].forEach(k=>{ if(g[k]!=null) state[k]=g[k]; });
  state.poss=g.poss||state.poss; state.otPoss=g.otPoss||state.otPoss; state.log=g.log||[];
  state.pendingO1=g.pendingO1; state.pendingO2=g.pendingO2; state.pendingD=g.pendingD;
  faces={d1:g.pendingO1,d2:g.pendingO2,d3:g.pendingD};
  if(g.kits&&g.kits.away&&g.kits.home) state.kits=g.kits;
  if(g.box&&g.box.away) state.box=g.box;
  screen="play"; show(); scheduleCpu();
}
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
async function shake(which, final){
  let t=0, iv=45;
  while(t<720){
    const n=d6();
    if(which==="d1") faces.d1=n; else if(which==="d2") faces.d2=n; else if(which==="d3") faces.d3=n; else d4=n;
    renderPlay();
    await sleep(iv); t+=iv; iv=Math.min(170, iv*1.16);
  }
  if(which==="d1") faces.d1=final; else if(which==="d2") faces.d2=final; else if(which==="d3") faces.d3=final; else d4=final;
}
function hideBanner(){ banner=null; const w=bannerWait; bannerWait=null; if(w) w(); renderPlay(); }
function showBanner(b){
  banner=b; renderPlay();
  if(b.kind==="play") return Promise.resolve();
  return new Promise(res=>{ bannerWait=res; });
}
function scheduleCpu(){
  clearTimeout(cpuTimer);
  if(screen!=="play"||!state||state.over||state.awaitingToss||state.mode!=="cpu"||busy||(banner&&banner.kind!=="play")) return;
  let ms=0, fn=null;
  if(state.offense==="home"&&state.snap==="offense"){ ms=1200; fn=doOffense; }
  else if(state.offense==="away"&&state.snap==="defense"){ ms=1500; fn=doDefense; }
  else if(state.offense==="home"&&state.snap==="bonus"){ ms=1000; fn=doBonus; }
  else return;
  cpuTimer=setTimeout(()=>{ if(!busy) void fn(); }, ms);
}
async function afterResolved(){
  persistGame();
  if(state.over){
    recordFinished(); persistGame();
    const copy=gameOverCopy();
    await showBanner({word:copy.title, kind:"over", sub:copy.sub, persist:true});
  }
}
async function doOffense(){
  if(!state||state.over||state.awaitingToss||busy||state.snap!=="offense") return;
  if(banner&&banner.kind==="play") banner=null;
  if(state.mode==="cpu"&&state.offense==="home"&&cpuWantsPunt()){ await doPunt(); return; }
  busy=true; rolling.o=true; renderPlay();
  const o1=d6(), o2=d6();
  await Promise.all([shake("d1",o1), shake("d2",o2)]);
  rolling.o=false;
  state.pendingO1=o1; state.pendingO2=o2; state.pendingD=null; faces.d3=null; state.snap="defense"; d4=null; showD4=false;
  const look=outlookFor(o1,o2);
  state.outlookHead="If Defense Rolls"; state.outlookSum=look.summary; state.outlookHit=null;
  busy=false; renderPlay(); scheduleCpu();
}
async function doDefense(){
  if(!state||state.over||busy||state.snap!=="defense"||state.pendingO1==null) return;
  busy=true; rolling.d=true; renderPlay();
  const d=d6();
  await shake("d3",d);
  rolling.d=false;
  const peeked=resolve(state.pendingO1, state.pendingO2, d);
  if(peeked.type==="big"&&peeked.bonus==null){
    state.pendingD=d; state.snap="bonus"; showD4=true; d4=null;
    const raw=state.pendingO1+state.pendingO2-d;
    state.outlookHead="Bonus roll"; state.outlookSum="Big play! "+state.pendingO1+"+"+state.pendingO2+" − "+d+" = "+raw+". Roll the bonus die."; state.outlookHit=d;
    persistGame(); busy=false; renderPlay(); scheduleCpu(); return;
  }
  state.pendingD=d;
  const fx=applyPlay(peeked);
  if(fx.banner) await showBanner(fx.banner);
  if(fx.then) finishThen(fx.then);
  busy=false; renderPlay();
  await afterResolved();
  scheduleCpu();
}
async function doBonus(){
  if(!state||state.over||busy||state.snap!=="bonus") return;
  busy=true; showD4=true; rolling.b=true; renderPlay();
  const b=d6();
  await shake("b",b);
  rolling.b=false;
  const fx=applyPlay(resolve(state.pendingO1, state.pendingO2, state.pendingD, b));
  if(fx.banner) await showBanner(fx.banner);
  if(fx.then) finishThen(fx.then);
  busy=false; renderPlay();
  await afterResolved();
  scheduleCpu();
}
async function doPunt(){
  if(!state||state.over||state.awaitingToss||state.down!==4||state.snap!=="offense"||busy) return;
  busy=true;
  const fx=applyPunt();
  finishThen(fx.then);
  if(fx.banner) await showBanner(fx.banner);
  busy=false; renderPlay();
  await afterResolved();
  scheduleCpu();
}
function swatches(side, slot, pair){
  return '<div class="sw"><p>'+(slot==="primary"?"END ZONE / SLAB":"END ZONE TEXT")+'</p><div class="swatches">'+PALETTE.map(c=>{
    const disabled=slot==="secondary"&&(c[1]===pair.primary||!pairAllowed(pair.primary,c[1]));
    const on=pair[slot]===c[1];
    return '<button type="button" class="'+(on?"on":"")+'" data-side="'+side+'" data-slot="'+slot+'" data-hex="'+c[1]+'" style="background:'+c[1]+'" '+(disabled?"disabled":"")+' aria-label="'+c[2]+'"></button>';
  }).join("")+"</div></div>";
}
function openTeams(){
  const a=store.teams.away, h=store.teams.home;
  document.getElementById("sheet").innerHTML='<div class="sheet"><div class="panel"><h2 style="margin:0 0 8px">Team settings</h2>'+
    '<div class="kit"><p>YOUR TEAM</p><input id="nmA" maxlength="16" value="'+esc(a.name)+'">'+swatches("away","primary",a)+swatches("away","secondary",a)+'</div>'+
    '<div class="kit"><p>CPU</p><div class="locked">CPU</div><p style="margin-top:8px;letter-spacing:0;font-size:.7rem;font-weight:500">Colors roll new each game.</p></div>'+
    '<div class="kit"><p>PLAYER 2 · PASS AND PLAY</p><input id="nmH" maxlength="16" value="'+esc(h.name)+'">'+swatches("home","primary",h)+swatches("home","secondary",h)+'</div>'+
    '<button class="go" id="doneTeams" type="button" style="margin-top:16px">Done</button></div></div>';
  document.getElementById("nmA").oninput=e=>{ store.teams.away.name=clip(e.target.value); saveStore(); renderHome(); };
  document.getElementById("nmH").oninput=e=>{ store.teams.home.name=clip(e.target.value); saveStore(); renderHome(); };
  document.querySelectorAll(".swatches button").forEach(btn=>{
    btn.onclick=()=>{
      const side=btn.dataset.side, slot=btn.dataset.slot, hex=btn.dataset.hex;
      store.teams[side][slot]=hex;
      store.teams[side]=Object.assign({name:store.teams[side].name}, clampPair(store.teams[side]));
      saveStore(); openTeams();
      const el=document.getElementById(side==="away"?"nmA":"nmH");
      if(el) el.focus();
    };
  });
  document.getElementById("doneTeams").onclick=()=>{ document.getElementById("sheet").innerHTML=""; renderHome(); };
}
function openRules(){
  document.getElementById("sheet").innerHTML='<div class="sheet"><div class="panel rules"><h2 style="margin-top:0">How it works</h2>'+
    "<p>40-yard field. 8 possessions each, plus overtime if tied.</p><p>Each team has equal possessions in overtime.</p><p>Touchdown = 7. Safety = 2.</p><p>New drives start at your 10. A punt pins them at their 3.</p><p>For each play: Offense rolls two dice, then defense rolls one.</p>"+
    "<h3>Play result priority</h3><ol><li><strong>Pick six</strong> — two 1s vs a 6. Defense scores 7. Both teams use a possession. The team that threw it starts their next possession at their 10.</li>"+
    "<li><strong>Turnover</strong> — both dice 1 or 2 vs a 5 or 6. Defense takes over at the spot.</li><li><strong>Sack</strong> — defense die beats the sum. Loss is twice the difference.</li>"+
    "<li><strong>Stuffed</strong> — defense die beats each offense die. No gain.</li><li><strong>To the house</strong> — two 6s vs a 1. Touchdown from anywhere.</li>"+
    "<li><strong>Big play</strong> — both 5 or 6 vs a 1 or 2. Gain (sum − defense) plus a bonus die.</li><li><strong>Standard</strong> — anything else. Gain sum − defense.</li></ol>"+
    "<p>First down at each 10-yard stripe, not 10 yards from the last first down.</p><p>4th down: punt or go. Turnover on downs is at the spot.</p><p>Game can end early if one team leads by more than the other can score (7 per remaining possession).</p>"+
    '<p style="text-align:center;color:var(--gold);font-weight:800;letter-spacing:.16em;font-size:.65rem">DICE FOOTBALL 1.0</p><button class="go" id="closeRules" type="button">Close</button></div></div>';
  document.getElementById("closeRules").onclick=()=>{ document.getElementById("sheet").innerHTML=""; };
}
show();
</script>
</body>
